<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tamaouz Student Dashboard">
  <title>Tamaouz | Student Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html" aria-label="Tamaouz home">
    <img src="logo.jpg" alt="Tamaouz Research & Publication Consultancy">
  </a>
  <div class="top-actions">
    <a href="index.html#request" data-i18n="newRequest">New Request</a>
    <button id="languageToggle" class="language-toggle" type="button">العربية</button>
  </div>
</header>

<main class="wrap">
  <section class="page-head">
    <div>
      <p class="eyebrow" data-i18n="eyebrow">STUDENT DASHBOARD</p>
      <h1 data-i18n="title">My Requests</h1>
      <p data-i18n="subtitle">Enter the email used when you submitted your requests to view your request history and status.</p>
    </div>
    <a class="btn" href="index.html#request" data-i18n="create">Create New Request</a>
  </section>

  <section class="lookup-card">
    <form id="lookupForm" novalidate>
      <label class="email-field">
        <span data-i18n="email">Email Address</span>
        <input id="email" required type="email" autocomplete="email" placeholder="name@example.com">
      </label>
      <button class="btn" type="submit" data-i18n="track">View My Requests</button>
    </form>
    <p id="message" class="message" hidden></p>
  </section>

  <section id="dashboardSummary" class="summary-grid" hidden></section>
  <section id="requestsList" class="requests-list" hidden></section>
  <section id="requestResult" class="result" hidden></section>
</main>

<footer><span>© 2026 Tamaouz — Research &amp; Publication Consultancy</span></footer>
<script src="dashboard.js"></script>
</body>
</html>
